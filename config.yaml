project:
  name: chronoshorts-history-hooks
  series: History Hooks
  audience: american_viewers
  language: en
  aspect_ratio: "9:16"
  width: 1080
  height: 1920
  fps: 30
  max_duration_sec: 58  # Hard-trim ≤59s Shorts (cushion under gate max 59)

paths:
  topics: topics
  scripts: scripts
  audio: audio
  media_raw: media/raw
  media_processed: media/processed
  captions: captions
  out: out
  bgm: bgm
  prompts: prompts
  scenarios: scenarios
  seo: seo

script:
  provider: template
  ollama_url: http://127.0.0.1:11434
  ollama_model: llama3.2
  # Viral Shorts budget: ~40–55s spoken ≈ 115–160 words @ ~150–170 WPM (TTS ~1.05)
  target_words_min: 115
  target_words_max: 160
  target_words_sweet: 125  # expand short templates toward this before clamp
  target_duration_sec_min: 40
  target_duration_sec_max: 55
  prompt_file: prompts/script_system.txt
  viral_prompt_file: prompts/script_viral.txt
  language: en
  require_source: true  # fact gate before TTS — never invent sources
  viral_structure: ["claim", "evidence", "relevance", "twist", "payoff"]

tts:
  # auto | elevenlabs | kokoro | kokoro_onnx
  # auto (recommended): ELEVENLABS_API_KEY / ELEVEN_API_KEY set → ElevenLabs multilingual_v2;
  #                      no key → free Kokoro am_michael. ElevenLabs never required.
  # elevenlabs: same runtime (prefer EL + Kokoro fallback); auto is clearer in docs.
  # kokoro / kokoro_onnx: force free local TTS (ignore ElevenLabs secret).
  provider: auto
  fallback: kokoro
  # LOCKED brand voice — Zack D. Films–style young US male storyteller (Kokoro path)
  # Do not rotate per episode; A/B only via explicit config change
  voice_locked: true
  voice: am_michael
  # Shorts pace: punchy faceless storytelling (TikTok/YT Shorts familiar)
  speed: 1.14
  lang: en-us
  kokoro_onnx_voice: am_michael
  kokoro_onnx_model: "C:/kokoro-models/kokoro-v1.0.onnx"
  kokoro_onnx_voices: "C:/kokoro-models/voices-v1.0.bin"
  edge_voice: en-US-ChristopherNeural
  edge_rate: "+12%"
  # PAYG path — key ONLY via GitHub secret / env (never paste in chat or commit)
  elevenlabs:
    # Secret: ELEVENLABS_API_KEY (alias ELEVEN_API_KEY). Multilingual v2 narration.
    model_id: eleven_multilingual_v2
    # Will (premade) — young-adult American male; conversational + fast storyteller.
    # Closest stock match to Zack D. Films faceless Shorts (not deep documentary Brian/Adam).
    # Alt A/B: Chris iP95p4xoKVk53GoZ742B (casual) | Josh TxGEqnHWrfWFTfGW9XjX (classic).
    voice_id: "bIHbv24MWmeRgasZH58o"
    voice_name: Will
    # Low stability + higher style = urgent, punchy asides like Zack D hooks
    stability: 0.28
    similarity_boost: 0.78
    style: 0.62
    use_speaker_boost: true
    speed: 1.14

media:
  # Cartoon / caricature Shorts stills (see prompts/image_style.txt) — not photoreal
  # Cloud default: fal.ai Flux Schnell (~$0.003–0.006/img → ~$6–10/mo @ ~1000 imgs; cap $30)
  # wikimedia | ai_local | ai_api
  provider: ai_api
  style_prompt_file: prompts/image_style.txt
  ai_local:
    model: stabilityai/sd-turbo
    steps: 4
    guidance: 0.0
    allow_free_api_fallback: true  # Pollinations HTTP if torch/diffusers missing
  ai_api:
    # fal_flux_schnell | pollinations — fal needs FAL_KEY or IMAGE_API_KEY secret
    backend: fal_flux_schnell
    fal_endpoint: "fal-ai/flux/schnell"
    width: 768
    height: 1344
    num_inference_steps: 4
    budget:
      monthly_cap_usd: 30.0
      # Conservative estimate (Schnell ~$0.003/MP; 768x1344 ≈ 1–2 MP billed)
      cost_per_image_usd: 0.006
      # Soft stop: if month spend would exceed cap, fall back to Pollinations ($0)
      fallback_when_over_budget: true
  image_count: 11
  seconds_per_image: 3.0  # ChronoShorts 2–4s cuts; hard max 4s in assemble
  scene_max_sec: 4.0
  scene_min_sec: 2.0
  ken_burns_zoom: 1.10
  user_agent: "yt-history-shorts/0.3 (local automation; educational)"
  score_enabled: true
  min_width: 700
  min_height: 500
  hard_min_width: 600
  hard_min_height: 450
  min_score: 20

captions:
  enabled: true
  provider: whisper
  whisper_model: base.en
  whisper_device: cpu
  whisper_compute_type: int8
  # Lower-middle safe zone (above ~300px Shorts UI); amber active-word karaoke
  words_per_line: 1
  font_name: Montserrat
  font_file: assets/fonts/Montserrat-Bold.ttf
  font_size: 92
  alignment: 2  # ASS bottom-center (lower-middle with margin_v)
  margin_v: 340  # keep karaoke clear of YouTube/IG bottom chrome
  primary_color: "&H0000B0FF"  # amber/yellow after sung (BGR)
  highlight_color: "&H00FFFFFF"  # white before karaoke fill
  outline_color: "&H00000000"
  outline: 7
  shadow: 0
  bold: true
  # Karaoke from first word at t≈0 (no cold-open delay)
  hook_seconds: 0
  hook_font_size: 100
  hook_margin_v: 340
  hook_color: "&H0000B0FF"
  karaoke_snap_to_zero: true
  karaoke_max_lead_sec: 0.45
  # Frame-1 CLAIM card — top third, clear of lower ~300px UI
  claim_card: true
  claim_seconds: 2.6
  claim_font_size: 72
  claim_margin_v: 220
  claim_alignment: 8  # top-center
  claim_color: "&H00FFFFFF"
  claim_outline: 8
  claim_max_chars: 72

assemble:
  crf: 17
  preset: medium
  crossfade_sec: 0.4
  loudnorm_i: -14
  loudnorm_tp: -1.5
  loudnorm_lra: 11
  vignette: true
  vignette_angle: "PI/6"  # softer than PI/5
  warm_midtones: true
  grain: true
  grain_strength: 4
  contrast: 1.07
  saturation: 0.96
  brightness: 0.02

audio_mix:
  narration_volume: 1.0
  # Louder war bed under Will (Shorts) narration; sidechain duck keeps voice clear
  bgm_volume: 0.40
  bgm_file: "war_military_underscore.mp3"
  bgm_duck: true

# Cinematic SFX stings timed to viral beats (hook / twist / payoff).
# Prefer ElevenLabs Sound Generation once → cache under assets/sfx/ (not per video).
audio:
  sfx_enabled: true  # mirror of audio.sfx.enabled for quick toggles
  sfx:
    enabled: true
    prefer_elevenlabs: true
    model_id: eleven_text_to_sound_v2
    prompt_influence: 0.35
    volume: 0.20          # under narration; ~0.15–0.25 range
    cache_dir: assets/sfx
    # Fractions of narration duration when meta has no claim_at/twist_at/payoff_at
    hook_at_frac: 0.02
    twist_at_frac: 0.52
    payoff_at_frac: 0.90
    durations:
      hook: 0.85
      twist: 1.0
      payoff: 0.90
    prompts:
      hook: "short cinematic whoosh transition, airy sweep, history documentary sting, 0.8 seconds, no voice, no music melody"
      twist: "soft cinematic impact hit with subtle tension riser tail, dark curiosity, 1.0 seconds, no voice, no melody"
      payoff: "punchy soft cinematic impact boom, documentary payoff sting, 0.9 seconds, no voice, no melody"

quality_gates:
  min_duration_sec: 35  # hard fail if far under target
  max_duration_sec: 59  # hard Shorts cap (assemble hard-trims to project.max ≤58)
  preferred_duration_sec_min: 40  # soft warn below viral window
  preferred_duration_sec_max: 55
  require_audio: true
  require_video: true
  require_source: true

schedule:
  timezone: Europe/Istanbul  # GMT+3
  times: ["00:00", "08:00", "16:00"]
  auto_upload: true
  require_approval: false  # FULL AUTOPILOT — never wait for Approve / review queue
  privacy: public  # YouTube — herkese açık; IG Reels / TikTok feed de public

platforms:
  youtube: true
  instagram: true
  tiktok: true

upload:
  mode: autopilot  # cloud schedule posts immediately; Atelier Approve is optional/manual only
  privacy: public
  category_id: "27"
  credentials_dir: credentials
  # Identity only (OAuth) — never a password
  google_account: efsaneshorts@gmail.com
  language: en
  # P0 SEO: max 3 tags total (seo_pack enforces). Prefer Shorts + topical.
  default_tags:
    - Shorts
    - history
    - History Shorts
  max_tags: 3
