project:
  name: chronoshorts-history-hooks
  series: History Hooks
  audience: american_viewers
  language: en
  aspect_ratio: "9:16"
  width: 1080
  height: 1920
  fps: 30
  max_duration_sec: 58  # Shorts soft max (≤60s); assemble/upload warn if over

paths:
  topics: topics
  scripts: scripts
  audio: audio
  media_raw: media/raw
  media_processed: media/processed
  captions: captions
  out: out
  bgm: bgm
  prompts: prompts
  scenarios: scenarios
  seo: seo

script:
  provider: template
  ollama_url: http://127.0.0.1:11434
  ollama_model: llama3.2
  target_words_min: 80
  target_words_max: 140
  prompt_file: prompts/script_system.txt
  language: en

tts:
  provider: kokoro
  # ChronoShorts: clear US male documentary narrator (not ultra-deep gravel)
  # A/B: am_michael, am_onyx; deeper drama: am_fenrir @ 1.0
  voice: am_adam
  speed: 1.05
  lang: en-us
  kokoro_onnx_voice: am_adam
  kokoro_onnx_model: "C:/kokoro-models/kokoro-v1.0.onnx"
  kokoro_onnx_voices: "C:/kokoro-models/voices-v1.0.bin"
  edge_voice: en-US-ChristopherNeural
  edge_rate: "+5%"

media:
  # ChronoShorts match: AI painterly stills (see STYLE_GUIDE_CHRONOSHORTS.md)
  # Cloud default: fal.ai Flux Schnell (~$0.003–0.006/img → ~$6–10/mo @ ~1000 imgs; cap $30)
  # wikimedia | ai_local | ai_api
  provider: ai_api
  style_prompt_file: prompts/image_style.txt
  ai_local:
    model: stabilityai/sd-turbo
    steps: 4
    guidance: 0.0
    allow_free_api_fallback: true  # Pollinations HTTP if torch/diffusers missing
  ai_api:
    # fal_flux_schnell | pollinations — fal needs FAL_KEY or IMAGE_API_KEY secret
    backend: fal_flux_schnell
    fal_endpoint: "fal-ai/flux/schnell"
    width: 768
    height: 1344
    num_inference_steps: 4
    budget:
      monthly_cap_usd: 30.0
      # Conservative estimate (Schnell ~$0.003/MP; 768x1344 ≈ 1–2 MP billed)
      cost_per_image_usd: 0.006
      # Soft stop: if month spend would exceed cap, fall back to Pollinations ($0)
      fallback_when_over_budget: true
  image_count: 11
  seconds_per_image: 3.0  # ChronoShorts ~3s cuts; hard max 5s in assemble/captions
  ken_burns_zoom: 1.06
  user_agent: "yt-history-shorts/0.3 (local automation; educational)"
  score_enabled: true
  min_width: 700
  min_height: 500
  hard_min_width: 600
  hard_min_height: 450
  min_score: 20

captions:
  enabled: true
  provider: whisper
  whisper_model: base.en
  whisper_device: cpu
  whisper_compute_type: int8
  # ChronoShorts: 1 centered word, white + thick black outline
  words_per_line: 1
  font_name: Arial
  font_size: 96
  alignment: 5  # ASS middle-center
  margin_v: 0
  primary_color: "&H00FFFFFF"
  highlight_color: "&H00FFFFFF"  # no yellow karaoke flash
  outline_color: "&H00000000"
  outline: 7
  shadow: 0
  bold: true
  # ChronoShorts jumps straight into center words (no long cold-open banner)
  hook_seconds: 0
  hook_font_size: 104
  hook_margin_v: 0
  hook_color: "&H00FFFFFF"

assemble:
  crf: 17
  preset: medium
  crossfade_sec: 0.4
  loudnorm_i: -14
  loudnorm_tp: -1.5
  loudnorm_lra: 11
  vignette: true
  grain: true
  grain_strength: 4
  contrast: 1.07
  saturation: 0.94
  brightness: 0.015

audio_mix:
  narration_volume: 1.0
  # Audible soft underscore — ducked under voice (sidechain); hearable in pauses
  bgm_volume: 0.31
  bgm_file: "cinematic_ambient_underscore.mp3"
  bgm_duck: true

quality_gates:
  min_duration_sec: 20
  max_duration_sec: 60
  require_audio: true
  require_video: true

schedule:
  timezone: Europe/Istanbul  # GMT+3
  times: ["00:00", "08:00", "16:00"]
  auto_upload: true
  require_approval: false  # FULL AUTOPILOT — never wait for Approve / review queue
  privacy: public  # YouTube — herkese açık; IG Reels / TikTok feed de public

platforms:
  youtube: true
  instagram: true
  tiktok: true

upload:
  mode: autopilot  # cloud schedule posts immediately; Atelier Approve is optional/manual only
  privacy: public
  category_id: "27"
  credentials_dir: credentials
  # Identity only (OAuth) — never a password
  google_account: efsaneshorts@gmail.com
  language: en
  default_tags:
    - Shorts
    - history
    - History Shorts
    - ChronoShorts
    - documentary
    - did you know
    - world history
    - American history
