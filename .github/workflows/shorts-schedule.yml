# ChronoShorts — FULL AUTOPILOT cloud schedule (PC OFF)
# Europe/Istanbul (GMT+3): 00:00 / 08:00 / 16:00
# UTC crons: 21:00 previous day | 05:00 | 13:00
#
# Panel remote (workflow_dispatch action):
#   run_now | preview_only | skip_slot | clear_skip
# Secrets never committed. Missing IG/TT secrets → skip those platforms gracefully.

name: ChronoShorts Schedule

on:
  schedule:
    # 00:00 Istanbul = 21:00 UTC (previous calendar day in UTC)
    - cron: "0 21 * * *"
    # 08:00 Istanbul = 05:00 UTC
    - cron: "0 5 * * *"
    # 16:00 Istanbul = 13:00 UTC
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      action:
        description: "Panel action (run_now / preview_only / skip_slot / clear_skip)"
        type: choice
        options:
          - run_now
          - preview_only
          - skip_slot
          - clear_skip
        default: run_now
      dry_run:
        description: "Dry-run only (no render/upload) — legacy"
        type: boolean
        default: false
      skip_upload:
        description: "Render but skip all uploads — legacy (prefer preview_only)"
        type: boolean
        default: false
      topic_id:
        description: "Optional topic id override"
        required: false
        type: string
      skip_date:
        description: "For skip_slot/clear_skip — YYYY-MM-DD (Istanbul)"
        required: false
        type: string
      skip_time:
        description: "For skip_slot/clear_skip — HH:MM e.g. 08:00"
        required: false
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: chronoshorts-schedule
  cancel-in-progress: false

jobs:
  # Lightweight path: panel skip controls (no Docker)
  panel-skip:
    if: >
      github.event_name == 'workflow_dispatch' &&
      (inputs.action == 'skip_slot' || inputs.action == 'clear_skip')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply skip / clear
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail
          mkdir -p logs
          python src/panel_remote.py \
            --action "${{ inputs.action }}" \
            --skip-date "${{ inputs.skip_date }}" \
            --skip-time "${{ inputs.skip_time }}"

      - name: Persist skip_slots + latest.json
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logs/skip_slots.json logs/latest.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No skip state changes to commit"
          else
            git commit -m "chore(panel): ${{ inputs.action }} schedule skip [skip ci]"
            git push
          fi

  produce-and-upload:
    if: >
      github.event_name != 'workflow_dispatch' ||
      (inputs.action != 'skip_slot' && inputs.action != 'clear_skip')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache HuggingFace / Torch models
        uses: actions/cache@v4
        with:
          path: |
            .cache/huggingface
            .cache/torch
          key: models-${{ hashFiles('requirements.txt', 'requirements-cloud.txt', 'Dockerfile') }}
          restore-keys: |
            models-

      - name: Write YouTube OAuth credentials from secrets
        env:
          YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          mkdir -p credentials
          if [ -n "$YOUTUBE_CLIENT_SECRET_JSON" ]; then
            printf '%s' "$YOUTUBE_CLIENT_SECRET_JSON" > credentials/client_secret.json
            echo "Wrote client_secret.json"
          else
            echo "WARNING: YOUTUBE_CLIENT_SECRET_JSON secret missing"
          fi
          if [ -n "$YOUTUBE_TOKEN_JSON" ]; then
            printf '%s' "$YOUTUBE_TOKEN_JSON" > credentials/youtube_token.json
            echo "Wrote youtube_token.json"
          else
            echo "WARNING: YOUTUBE_TOKEN_JSON secret missing"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ChronoShorts image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: chronoshorts:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run scheduled job
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          META_GRAPH_VERSION: ${{ secrets.META_GRAPH_VERSION }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          TIKTOK_PRIVACY_LEVEL: PUBLIC_TO_EVERYONE
          TIKTOK_MODE: ${{ secrets.TIKTOK_MODE }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          IMAGE_API_KEY: ${{ secrets.IMAGE_API_KEY }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail
          ARGS=()
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ACTION="${{ inputs.action }}"
            if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS+=(--dry-run); fi
            if [ "${{ inputs.skip_upload }}" = "true" ] || [ "$ACTION" = "preview_only" ]; then
              ARGS+=(--skip-upload)
            fi
            if [ -n "${{ inputs.topic_id }}" ]; then ARGS+=(--topic-id "${{ inputs.topic_id }}"); fi
          fi
          mkdir -p .cache/huggingface .cache/torch logs out topics/used
          # credentials volume is RW so OAuth token refresh can rewrite youtube_token.json
          docker run --rm \
            -e META_ACCESS_TOKEN \
            -e IG_USER_ID \
            -e META_GRAPH_VERSION \
            -e TIKTOK_ACCESS_TOKEN \
            -e TIKTOK_PRIVACY_LEVEL \
            -e TIKTOK_MODE \
            -e FAL_KEY \
            -e IMAGE_API_KEY \
            -e GITHUB_RUN_ID \
            -e GITHUB_REPOSITORY \
            -e GITHUB_SERVER_URL \
            -e ESPEAK_DATA_PATH=/usr/lib/x86_64-linux-gnu/espeak-ng-data \
            -e HF_HOME=/root/.cache/huggingface \
            -v "$PWD/credentials:/app/credentials" \
            -v "$PWD/topics:/app/topics" \
            -v "$PWD/logs:/app/logs" \
            -v "$PWD/out:/app/out" \
            -v "$PWD/.cache/huggingface:/root/.cache/huggingface" \
            -v "$PWD/.cache/torch:/root/.cache/torch" \
            chronoshorts:latest \
            python src/scheduled_run.py "${ARGS[@]+"${ARGS[@]}"}"

      - name: Upload job logs artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chronoshorts-logs
          path: |
            logs/latest.json
            logs/jobs.jsonl
            logs/budget.json
            logs/schedule.log
            logs/skip_slots.json
          if-no-files-found: warn

      - name: Upload preview mp4 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chronoshorts-preview-mp4
          path: out/*.mp4
          if-no-files-found: warn
          retention-days: 7

      - name: Persist used/uploaded topics + status logs
        # Always run: even partial success must keep mark_claimed so next cron
        # does not re-pick the same topic (fixes 3× same Short / day).
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p topics/used logs
          # Claim markers + upload ledger + logs (never credentials)
          # Only add files that exist (uploaded.jsonl appears after first successful upload)
          git add topics/used \
            logs/schedule.log logs/latest.json logs/jobs.jsonl logs/budget.json \
            logs/skip_slots.json logs/force_next_topic.json 2>/dev/null || true
          # force_next_topic.json may be deleted after midnight upload — stage deletion
          if [ ! -f logs/force_next_topic.json ]; then
            git rm -f --ignore-unmatch logs/force_next_topic.json 2>/dev/null || true
          fi
          if [ -f topics/uploaded.jsonl ]; then git add topics/uploaded.jsonl; fi
          if git diff --staged --quiet; then
            echo "No state changes to commit"
          else
            echo "Persisting topic rotation state (used/ + uploaded.jsonl) so next slot gets a DIFFERENT video"
            git status --short
            git commit -m "chore(schedule): persist unique topic claim + upload ledger [skip ci]"
            git push
          fi
